# Checks every push to main and every pull request: interface (types, lint,
# tests, build, npm audit) then Rust (format, Clippy, tests, cargo-deny), an
# audit of the workflows themselves (zizmor) and, on pull requests, a review
# of the new dependencies. The three jobs are required on main. The release
# workflow runs it too and only publishes when it passes.
# Actions are pinned to a commit SHA; Dependabot updates them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Windows: the platform Kanade runs on, and Tauri builds there without
    # extra system packages.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Interface tests
        run: npm test

      # Tauri embeds the built interface: Rust needs dist/ to compile.
      - name: Build the interface
        run: npm run build

      - name: npm dependency audit
        run: npm audit --audit-level=high

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      # --locked: fails when Cargo.lock is out of date with Cargo.toml instead
      # of quietly updating it, as npm ci does for npm.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      # Known vulnerabilities, allowed licences, crate sources and duplicated
      # versions: src-tauri/deny.toml. The binary is cached by rust-cache;
      # raise the version here to update it (Dependabot does not see it).
      - name: Rust dependency checks (cargo-deny)
        working-directory: src-tauri
        shell: bash
        run: |
          [ "$(cargo deny --version 2>/dev/null)" = "cargo-deny 0.22.0" ] || cargo install cargo-deny --locked --version 0.22.0
          cargo deny --locked check

  # Static audit of the workflows (injections, permissions, credentials left
  # in the checkout, unpinned actions...). Fails on any finding.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          # Exact version, among those this action release knows (its
          # support/locks folder): raise it when Dependabot updates the action.
          version: 1.33.0
          advanced-security: false
          annotations: true

  # On a pull request: refuses a new dependency with a known vulnerability
  # (high and above) or an incompatible license, before it lands on main.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
