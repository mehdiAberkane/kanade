# Checks every push to main and every pull request, in parallel:
# - interface, on Ubuntu (faster to start): types, lint, formatting, tests
#   with coverage thresholds, npm audit, unused code (knip);
# - rust, on Windows (the platform Kanade runs on): format, Clippy, tests with
#   a coverage threshold, cargo-deny, unused crates (cargo-machete);
# - workflows: an audit of the workflows themselves (zizmor);
# - dependency-review, on pull requests: the new dependencies;
# - installer, after a merge on main only: the packaged app as an artifact.
# The first four are required on main. The release workflow runs it too and only
# publishes when it passes.
# Actions are pinned to a commit SHA; Dependabot updates them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      # Type-aware strict rules and accessibility: eslint.config.js.
      - name: Lint (ESLint)
        run: npm run lint

      # The interface's counterpart of cargo fmt: `npm run format` fixes it.
      - name: Formatting (Prettier)
        run: npm run format:check

      # Thresholds in vitest.config.ts; the summary is printed in the log.
      - name: Interface tests, with coverage thresholds
        run: npm run test:coverage

      - name: npm dependency audit
        run: npm audit --audit-level=high

      # Files, exports and npm dependencies nothing uses (knip finds the entry
      # points through Vite, Vitest, ESLint and the package.json scripts).
      - name: Unused code and dependencies (knip)
        run: npm run knip

  rust:
    # Windows: the platform Kanade runs on, and Tauri builds there without
    # extra system packages.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # llvm-tools-preview: what cargo-llvm-cov measures Rust coverage with.
          components: clippy, rustfmt, llvm-tools-preview

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          # Part of the cache key. rust-cache saves nothing when an entry with
          # the same key exists, and the key only follows Cargo.toml/Cargo.lock
          # and the toolchain: a newly installed tool (cargo-deny, cargo-machete,
          # cargo-llvm-cov) or a new build (target/llvm-cov-target) is only
          # kept once the key changes. Bump it in that case.
          key: v1

      # Tauri embeds the built interface: Rust needs dist/ to compile.
      - run: npm ci --ignore-scripts

      - name: Build the interface
        run: npm run build

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      # --locked: fails when Cargo.lock is out of date with Cargo.toml instead
      # of quietly updating it, as npm ci does for npm.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      # The tests, with line coverage: the table per file is printed in the log.
      # The binary is cached by rust-cache; raise the version here to update it.
      # Threshold: 95 % of lines, just under the 95.77 % reached in November
      # 2026 (KAN-2). Raise it as tests are added, never lower it.
      - name: Rust tests, with coverage threshold
        working-directory: src-tauri
        shell: bash
        run: |
          [ "$(cargo llvm-cov --version 2>/dev/null)" = "cargo-llvm-cov 0.9.2" ] || cargo install cargo-llvm-cov --locked --version 0.9.2
          cargo llvm-cov --locked --fail-under-lines 95 || {
            echo "::error::Rust tests failed, or line coverage is under 95 % (table above)"
            exit 1
          }

      # Known vulnerabilities, allowed licences, crate sources and duplicated
      # versions: src-tauri/deny.toml. The binary is cached by rust-cache;
      # raise the version here to update it (Dependabot does not see it).
      - name: Rust dependency checks (cargo-deny)
        working-directory: src-tauri
        shell: bash
        run: |
          [ "$(cargo deny --version 2>/dev/null)" = "cargo-deny 0.22.0" ] || cargo install cargo-deny --locked --version 0.22.0
          cargo deny --locked check

      # Crates declared in Cargo.toml that the code never uses. It reads the
      # sources as text: a crate used only by a macro's generated code must be
      # listed in [package.metadata.cargo-machete] ignored. The binary is
      # cached by rust-cache; raise the version here to update it.
      - name: Unused Rust dependencies (cargo-machete)
        working-directory: src-tauri
        shell: bash
        run: |
          [ "$(cargo machete --version 2>/dev/null)" = "0.10.1" ] || cargo install cargo-machete --locked --version 0.10.1
          cargo machete

  # After each merge on main: the whole app, packaged (MSI and setup .exe),
  # attached to the run (Summary › Artifacts) to try a card in « A verifier »
  # without building locally. Not on pull requests (time), nor during a
  # release, which builds and signs its own. Not required on main.
  installer:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      # Its own cache entry (the key includes the job): the release build.
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: v1

      - run: npm ci --ignore-scripts

      # tauri.unsigned.conf.json: no update signature, the signing key only
      # reaches release.yml. The last --locked goes to cargo build.
      - name: Build the installers
        run: npm run tauri build -- --config src-tauri/tauri.unsigned.conf.json -- --locked

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kanade-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  # Static audit of the workflows (injections, permissions, credentials left
  # in the checkout, unpinned actions...). Fails on any finding.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          # Exact version, among those this action release knows (its
          # support/locks folder): raise it when Dependabot updates the action.
          version: 1.33.0
          advanced-security: false
          annotations: true

  # On a pull request: refuses a new dependency with a known vulnerability
  # (high and above) or an incompatible license, before it lands on main.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
