<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Source of the app icon. Regenerate src-tauri/icons with: npm run tauri icon app-icon.svg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <!-- Two beamed eighth notes -->
  <g fill="#ffffff">
    <ellipse cx="330" cy="745" rx="120" ry="90" transform="rotate(-25 330 745)"/>
    <ellipse cx="690" cy="665" rx="120" ry="90" transform="rotate(-25 690 665)"/>
    <rect x="397" y="300" width="50" height="445"/>
    <rect x="757" y="220" width="50" height="445"/>
    <polygon points="397,258 807,178 807,290 397,370"/>
  </g>
</svg>
