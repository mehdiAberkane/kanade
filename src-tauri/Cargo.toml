[package]
name = "kanade"
version = "0.4.0"
description = "Kanade - music library manager for Windows"
authors = ["devsecops-force"]
edition = "2024"
# Not a library for crates.io: an app, shipped as an installer.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kanade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The build of the end-to-end tests (`npm run test:e2e`), never published:
# the folder picker answers with a folder the test gives, and the database
# goes to a folder of its own (src/e2e.rs).
e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# The code generate_context! writes (lib.rs) calls serde_json directly.
serde_json = "1"
lofty = "0.25.5"
walkdir = "2.5.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
# The folder picker and the save dialog of Windows, opened from the Rust
# side only: the interface never gives a path (commands.rs).
rfd = { version = "0.17.2", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# The libraries' folders watched while Kanade is open (KAN-27,
# library/watcher.rs). Kept on 8: notify 9 brings xxhash-rust, under the Boost
# license (BSL-1.0), which deny.toml does not allow (chosen on 26/11/2026).
notify = "8.2.0"
# Playing with a player installed on Windows (KAN-45, player/): the
# registry tells the players, already in the tree through Tauri; the
# icons are asked of Windows as the Explorer does (MIT, chosen on
# 27/11/2026). Neither puts unsafe code in Kanade.
windows-registry = "0.6.1"
file_icon_provider = "1.0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# No panic = "abort": a panic in lofty on a hostile audio file must be
# caught (library/track.rs), not close Kanade at every scan.
strip = true

[dev-dependencies]
tempfile = "3.27.0"
# Mock runtime: the commands are tested through Tauri's IPC (commands.rs).
tauri = { version = "2", features = ["test"] }

# Clippy rules beyond the defaults, chosen from the pedantic group rather
# than all of it (too noisy). The CI runs Clippy with -D warnings: each one
# fails the build.
[lints.clippy]
# Numbers: a silent truncation or sign loss in a duration or a bitrate.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
# Copies and allocations for nothing.
needless_pass_by_value = "warn"
implicit_clone = "warn"
redundant_clone = "warn"
inefficient_to_string = "warn"
# Readability.
manual_let_else = "warn"
redundant_closure_for_method_calls = "warn"
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
items_after_statements = "warn"
map_unwrap_or = "warn"
unnecessary_wraps = "warn"
