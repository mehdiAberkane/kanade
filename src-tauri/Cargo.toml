[package]
name = "kanade"
version = "0.2.0"
description = "Kanade - music library manager for Windows"
authors = ["devsecops-force"]
edition = "2024"
# Not a library for crates.io: an app, shipped as an installer.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kanade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25.5"
walkdir = "2.5.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# Clippy rules beyond the defaults, chosen from the pedantic group rather
# than all of it (too noisy). The CI runs Clippy with -D warnings: each one
# fails the build.
[lints.clippy]
# Numbers: a silent truncation or sign loss in a duration or a bitrate.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
# Copies and allocations for nothing.
needless_pass_by_value = "warn"
implicit_clone = "warn"
redundant_clone = "warn"
inefficient_to_string = "warn"
# Readability.
manual_let_else = "warn"
redundant_closure_for_method_calls = "warn"
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
items_after_statements = "warn"
map_unwrap_or = "warn"
unnecessary_wraps = "warn"
